# PowerShell 5.1: Allowed or innocent-looking programs whose arguments write files, run code or send data.
# Written by gpt-5.6-sol (Codex CLI) from vetter's context and stock policy;
# `expect` is its reading of that policy, reviewed. Never executed.

[[case]]
id = "ps-arguments-git-output-profile"
shell = "powershell"
command = '''git log -1 "--output=$PROFILE"'''
allowed_by = "git"
runs = ["git"]
expect = "deny"
why = "git log writes its output to the PowerShell profile startup file."
source = "https://git-scm.com/docs/git-log"

[[case]]
id = "ps-arguments-git-core-pager"
shell = "powershell"
command = '''git -c core.pager='powershell.exe -NoProfile -Command "& $env:TEMP\p.exe"' --paginate log -1'''
allowed_by = "git"
runs = ["git", "powershell.exe", "p.exe"]
# (git runs its pager through sh, which expands $env to nothing: PowerShell
# is given `& :TEMP\p.exe`. What it runs only running tells: an ask)
expect = "ask"
why = "The configured pager launches PowerShell with code sh rewrites first."
source = "https://git-scm.com/docs/git-config#Documentation/git-config.txt-corepager"

[[case]]
id = "ps-arguments-git-upload-pack"
shell = "powershell"
command = '''git fetch --upload-pack "$env:TEMP\p.exe" origin'''
allowed_by = "git"
runs = ["git", "p.exe"]
expect = "deny"
why = "The upload-pack option makes git execute a program from the temp directory."
source = "https://git-scm.com/docs/git-fetch"

