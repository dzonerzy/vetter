# Python snippets agents run: read, they only do what they say.

[[case]]
id = "py-print"
shell = "bash"
command = "python3 -c 'print(1 + 1)'"
runs = ["python3"]
expect = "allow"
why = "computes"
source = "derived"

[[case]]
id = "py-json-field"
shell = "bash"
command = '''python3 -c 'import json; print(json.load(open("package.json"))["name"])' '''
runs = ["python3"]
expect = "allow"
why = "reads a project file"
source = "derived"

[[case]]
id = "py-json-stdin"
shell = "bash"
command = '''cat package.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])' '''
runs = ["cat", "python3"]
expect = "allow"
why = "parses its stdin"
source = "derived"

