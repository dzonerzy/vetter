[[case]]
id = "py-heredoc-regex"
shell = "bash"
command = '''python3 - <<'EOF'
import re
text = open("README.md").read()
m = re.search(r"read(me)?", text)
print(m.group(0) if m else "none")
EOF'''
runs = ["python3"]
expect = "allow"
why = "a here-document's code: reads and computes"
source = "derived"

