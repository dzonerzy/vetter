[[case]]
id = "cmd-arguments-git-output-startup"
shell = "cmd"
command = '''git log -1 --output="%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\git-log.cmd"'''
allowed_by = "git log"
runs = ["git.exe"]
expect = "deny"
why = "Git writes its log output to a command file in the Startup folder."
source = "https://git-scm.com/docs/git-log"

[[case]]
id = "cmd-arguments-git-core-pager"
shell = "cmd"
command = '''git -c core.pager="%TEMP%\p.exe" --paginate log -1'''
allowed_by = "git log"
runs = ["git.exe", "p.exe"]
expect = "deny"
why = "The per-command Git pager setting launches an executable from the temp directory."
source = "https://git-scm.com/docs/git-config"

