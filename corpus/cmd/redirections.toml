command = '''echo @echo off>"%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\vetter.cmd"'''
allowed_by = "echo text output"
runs = ["echo"]
expect = "deny"
why = "Output redirection creates a command file in the user's Startup folder."
