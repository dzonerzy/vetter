[[case]]
id = "cmd-redirections-powershell-profile"
shell = "cmd"
command = '''echo Write-Output ready>"%USERPROFILE%\Documents\WindowsPowerShell\Microsoft.PowerShell_profile.ps1"'''
allowed_by = "echo text output"
runs = ["echo"]
expect = "deny"
why = "Output redirection writes a PowerShell profile startup file."
source = "https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_profiles"

[[case]]
id = "cmd-redirections-startup-folder"
