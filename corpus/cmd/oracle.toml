# What the Windows mutation oracle (tools/oracle/windows.py --mutate) found:
# variants run on the real cmd.exe that did what vetter didn't see. Fixed.

[[case]]
id = "oracle-cmd-if-redirect-write"
shell = "cmd"
command = '''if 1==1 echo x> %USERPROFILE%\.ssh\authorized_keys'''
runs = ["echo"]
expect = "deny"
why = "the if's command writes the file: the redirection is its"
source = "derived"

[[case]]
id = "oracle-cmd-if-redirect-read"
shell = "cmd"
command = '''if 1==1 more < %USERPROFILE%\.ssh\id_rsa'''
runs = ["more"]
expect = "deny"
why = "more reads the key"
source = "derived"

[[case]]
id = "oracle-cmd-if-else-redirect"
shell = "cmd"
command = '''if exist nothing-here (echo a) else echo b> %USERPROFILE%\.ssh\authorized_keys'''
runs = ["echo"]
expect = "deny"
why = "the else's command writes the file"
source = "derived"
