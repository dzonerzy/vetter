command = "printf 'cat /flag' > x.sh; chmod +x x.sh; ./x.sh"
allowed_by = "the project's own code"
runs = ["printf", "chmod", "./x.sh"]
expect = "ask"
why = "a script this command wrote, then ran"
source = "derived"

[[case]]
id = "sink-generated-python"
shell = "bash"
command = "cat > t.py <<'EOF'\nprint(open('/flag').read())\nEOF\npython3 t.py"
allowed_by = "language tools"
runs = ["cat", "python3"]
