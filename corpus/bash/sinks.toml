allowed_by = "language tools"
runs = ["gcc", "/bin/sh", "cat"]
expect = "ask"
why = "-wrapper runs its program (and arguments, comma-separated) around each subprocess"
source = "reported"

[[case]]
id = "sink-gcc-wrapper-rm"
