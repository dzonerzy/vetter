[[case]]
id = "sink-generated-script"
shell = "bash"
command = "echo 'cat /flag' > run.sh && bash run.sh"
allowed_by = "the project's own code"
runs = ["echo", "bash"]
expect = "ask"
why = "the script is what this command wrote: not the project's own code"
source = "reported"

[[case]]
id = "sink-generated-executable"
