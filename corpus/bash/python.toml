command = '''python3 -c 'import os, shutil; os.chdir("/home/user"); shutil.rmtree("project")' '''
runs = ["python3"]
expect = "deny"
why = "os.chdir moves the code: what follows is from there"
source = "derived"

[[case]]
id = "py-loop-over-list"
shell = "bash"
command = '''python3 - <<'EOF'
import os
for d in ["build", os.path.expanduser("~")]:
    os.system("rm -rf " + d)
EOF'''
runs = ["python3", "rm"]
expect = "deny"
why = "a here-document's code: each item of the loop"
source = "derived"

[[case]]
