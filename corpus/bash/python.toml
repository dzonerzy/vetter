source = "derived"

[[case]]
id = "py-list-aliasing"
shell = "bash"
command = '''python3 -c 'import os; l = [len]; m = l; m[0] = os.system; l[0]("rm -rf ~")' '''
runs = ["python3", "rm"]
expect = "deny"
why = "two names for one list: a change through one seen through the other"
source = "derived"

[[case]]
id = "py-early-return"
shell = "bash"
command = '''python3 -c 'import os
cmd = "rm -rf ~"
def g():
    global cmd
    if os.getpid() > 1: return
    cmd = "ls"
g()
os.system(cmd)' '''
runs = ["python3"]
expect = "ask"
why = "the harmless value is only set on a way that may not run: either"
source = "derived"

[[case]]
id = "py-exception-skips"
shell = "bash"
command = '''python3 -c 'import os
cmd = "rm -rf ~"
try:
    int("x")
    cmd = "ls"
except Exception:
    pass
os.system(cmd)' '''
runs = ["python3"]
expect = "ask"
why = "an exception may skip the assignment: either value"
source = "derived"

[[case]]
id = "py-chdir"
