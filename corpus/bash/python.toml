expect = "deny"
why = "a command built by concatenation: computed"
source = "derived"

[[case]]
id = "py-getattr-computed"
shell = "bash"
command = '''python3 -c 'import os; getattr(os, "sys" + "tem")("rm -rf ~")' '''
runs = ["python3", "rm"]
expect = "deny"
