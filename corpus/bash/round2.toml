# The bypass audit's second round, 2026-10-12 (docs/12-analyzer-bypass-
# round2.md): its bash and Unix proofs, by finding id. Each was allowed by
# the stock policy at 2c358af.

[[case]]
id = "r2-B01-pushd-rotate"
shell = "bash"
command = "pushd / >/dev/null\npushd /home/user/project >/dev/null\npushd +1 >/dev/null\ncat flag"
runs = ["pushd", "cat"]
expect = "ask"
why = "pushd +1 rotates the stack back to /"
source = "audit"

[[case]]
id = "r2-B02-nameref"
shell = "bash"
command = "x=.\ndeclare -n r=x\nr=/\ncat \"$x/flag\""
runs = ["declare", "cat"]
expect = "ask"
why = "r is x: r=/ sets x"
source = "audit"

