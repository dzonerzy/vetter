# Environment variables that make a program run something, or change what
# runs (prefix assignments `X=v cmd`, `env X=v cmd`, `export X=v`)
[env]
GIT_SSH_COMMAND = "shell"
GIT_SSH = "program"
GIT_PAGER = "shell"
GIT_EDITOR = "shell"
GIT_SEQUENCE_EDITOR = "shell"
GIT_EXTERNAL_DIFF = "program"
GIT_ASKPASS = "program"
GIT_PROXY_COMMAND = "program"
GIT_EXEC_PATH = "code_file"
GIT_TEMPLATE_DIR = "code_file"
GIT_CONFIG_GLOBAL = "code_file"
GIT_CONFIG_SYSTEM = "code_file"
GIT_CONFIG_PARAMETERS = "git_config_list"
GIT_CONFIG_COUNT = "git_config_list"
PAGER = "shell"
MANPAGER = "shell"
EDITOR = "shell"
VISUAL = "shell"
SSH_ASKPASS = "program"
SUDO_ASKPASS = "program"
BROWSER = "shell"
LESSOPEN = "shell"
LESSCLOSE = "shell"
BASH_ENV = "code_file"
ENV = "code_file"
PROMPT_COMMAND = "shell"
PS4 = "shell_expanded"
# (an interactive bash's prompts, expanded as it shows them: bash -i)
PS0 = "shell_expanded"
PS1 = "shell_expanded"
PS2 = "shell_expanded"
PS3 = "shell_expanded"
LD_PRELOAD = "code_file"
LD_LIBRARY_PATH = "lookup_path"
LD_AUDIT = "code_file"
DYLD_INSERT_LIBRARIES = "code_file"
DYLD_LIBRARY_PATH = "lookup_path"
PATH = "lookup_path"
PYTHONSTARTUP = "code_file"
PYTHONPATH = "lookup_path"
PYTHONHOME = "lookup_path"
PERL5OPT = "code_file"
PERL5LIB = "lookup_path"
RUBYOPT = "code_file"
RUBYLIB = "lookup_path"
NODE_OPTIONS = "code_file"
NODE_PATH = "lookup_path"
npm_config_script_shell = "program"
NPM_CONFIG_SCRIPT_SHELL = "program"
CARGO_BUILD_RUSTC_WRAPPER = "program"
RUSTC_WRAPPER = "program"
RUSTC_WORKSPACE_WRAPPER = "program"
CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER = "program"
RUSTC = "program"
CC = "program"
CXX = "program"
MAKE = "program"
SHELL = "program"
# (more options, read as the program's own: options:PROGRAM, its spec)
MAKEFLAGS = "options:make"
MFLAGS = "options:make"
GOFLAGS = "options:go"
JAVA_TOOL_OPTIONS = "options:java"
_JAVA_OPTIONS = "options:java"
JDK_JAVA_OPTIONS = "options:java"
TAR_OPTIONS = "options:tar"
LESS = "options:less"
# (makefiles make reads before the project's)
MAKEFILES = "code_file_list"
# (where gcc finds cc1, as, ld: its programs)
COMPILER_PATH = "program_dir"
GCC_EXEC_PREFIX = "program_dir"
# (the user site python imports usercustomize and .pth files from)
PYTHONUSERBASE = "code_file"
# (options a config file gives: rg's --pre...)
RIPGREP_CONFIG_PATH = "configured"
# (the classes java runs, javac's processors)
CLASSPATH = "classpath"
CURL_HOME = "configured"
GRADLE_USER_HOME = "configured"
