# Compilers and runtimes: the options with which they run a program, load
# code, or write where they're told (gcc -wrapper, -B, -fplugin; rustc -C
# linker; java -javaagent). The policy's "language tools" allow them; what
# these options do is decided on its own.

# The C and C++ drivers (gcc's options; clang takes them too)
[[spec]]
name = ["gcc", "g++", "cc", "c++", "clang", "clang++", "cpp"]
values = ["-o", "-x", "-I", "-L", "-D", "-U", "-include", "-imacros", "-isystem", "-iquote", "-idirafter", "-MF", "-MT",
          "-MQ", "-wrapper", "-B", "-specs", "--specs", "-fplugin", "-fpass-plugin", "-fuse-ld", "-T", "--sysroot",
          "-target", "--target", "-Xlinker", "-Xassembler", "-Xpreprocessor", "-Xclang", "-arch", "-e", "-u",
          "--config", "--config-system-dir", "--config-user-dir", "--gcc-toolchain", "-ccc-install-dir",
          "-resource-dir", "--param", "-mllvm", "-z", "-isysroot", "-imultilib", "-iprefix", "-iwithprefix",
          "-iwithprefixbefore", "--ld-path"]
single_dash_long = true
attached = ["-o", "-B", "-MF", "-fprofile-generate=", "-fprofile-instr-generate=", "-fprofile-dir=",
            "-foptimization-record-file=", "-fopt-info", "-fprofile-use=", "-fprofile-instr-use=",
            "--gcc-toolchain=", "-ccc-install-dir="]
response_files = true
# (its sources: what it builds from)
operands = "read"
# (gcc's and clang's options by family; one outside them (-Xarch_..., what
# a forwarding option gives another program) an Unknown)
strict = true
switches = ["-c", "-S", "-E", "-v", "-###", "-pipe", "-pthread", "-pthreads", "-shared", "-rdynamic", "-pie",
            "-no-pie", "-s", "-w", "-ansi", "-r", "-C", "-CC", "-P", "-H", "-trigraphs", "-undef", "-time", "-Q",
            "-x", "--version", "-dumpversion", "-dumpmachine", "-dumpfullversion", "-dumpspecs", "-nolibc",
            "-nodefaultlibs", "-nostartfiles", "-nostdlib", "-nostdlib++", "-nostdinc", "-nostdinc++",
            "-symbolic", "-integrated-as", "-no-integrated-as", "-emit-llvm", "-fsyntax-only", "-print-search-dirs",
            "-print-libgcc-file-name", "-print-multiarch", "-print-multi-lib", "-print-multi-directory",
            "-print-sysroot", "-print-resource-dir", "-print-target-triple", "-print-effective-triple",
            "-print-targets", "-Qunused-arguments", "-Qn", "-Qy", "--help", "-help", "--verbose",
            "-gline-tables-only", "-coverage", "--coverage", "-p", "-pg", "-municode", "-mwindows", "-mconsole"]
families = ["-W", "-f", "-m", "-O", "-g", "-std=", "-D", "-U", "-I", "-L", "-l", "-M", "-print-file-name=",
            "-print-prog-name=", "-save-temps", "-static", "-pedantic", "-traditional", "-d", "--help=", "-march",
            "-mtune", "-mcpu", "-stdlib=", "-rtlib=", "-unwindlib=", "--rtlib", "--stdlib", "--target=", "-target",
            "--sysroot=", "-gdwarf", "-gsplit", "-gz", "-Xclang", "-Xlinker", "-Xassembler",
            "-Xpreprocessor", "-x", "-e", "-u", "-T", "-Ofast", "-Os", "-Oz", "-flto", "-fuse-ld="]
[spec.roles]
# (where the profile, the optimization records, -fopt-info's notes go)
"-fprofile-generate=" = "write"
"-fprofile-instr-generate=" = "write"
"-fprofile-dir=" = "write"
"-foptimization-record-file=" = "write"
"-fopt-info" = "opt_info"
"-fprofile-use=" = "read"
"-fprofile-instr-use=" = "read"
# (the toolchain whose as, ld it runs)
"--gcc-toolchain" = "program_dir"
"--gcc-toolchain=" = "program_dir"
"-ccc-install-dir" = "program_dir"
"-ccc-install-dir=" = "program_dir"
"--ld-path" = "program"
"-o" = "write"
"-MF" = "write"
"-include" = "read"
"-imacros" = "read"
"-wrapper" = "comma_program"
"-B" = "program_dir"
"-specs" = "code_file"
"--specs" = "code_file"
"-fplugin" = "code_file"
"-fpass-plugin" = "code_file"
"-fuse-ld" = "linker"
# (clang --config FILE: options read from it; the folders it finds them in)
"--config" = "config_file"
"--config-system-dir" = "configured"
"--config-user-dir" = "configured"

[[spec]]
name = ["cmake"]
values = ["-S", "-B", "-D", "-U", "-G", "-T", "-A", "-C", "-P", "--build", "--install", "--preset", "--toolchain",
          "--graphviz", "-j", "--parallel", "--target", "--config", "--prefix", "--component"]
attached = ["-D", "-S", "-B", "-G", "-C"]
# (the source tree or build tree it configures)
operands = "project"
[spec.roles]
# (-DKEY=VALUE: a script it includes, CMAKE_PROJECT_INCLUDE...)
"-D" = "cmake_define"
"-P" = "code_file"
"-C" = "code_file"
"--toolchain" = "code_file"
"--build" = "project"
"-S" = "project"
[spec.flags]
"cmake" = {reason = "runs the CMakeLists.txt, the build's commands", kind = "project_code"}

[[spec]]
name = ["rustc"]
values = ["-C", "--codegen", "-o", "--out-dir", "-L", "-l", "--extern", "--crate-type", "--crate-name", "--edition",
          "-Z", "--target", "--cfg", "--emit", "--sysroot"]
attached = ["-C", "-o", "-L", "-l", "-Z"]
response_files = true
operands = "read"
[spec.roles]
"-C" = "rustc_codegen"
"--codegen" = "rustc_codegen"
"-o" = "write"
"-Z" = "configured"
# (--extern NAME=PATH: a proc-macro crate's library runs in rustc)
"--extern" = "rustc_extern"

[[spec]]
name = ["java", "javaw"]
values = ["-cp", "-classpath", "--class-path", "-p", "--module-path", "-m", "--module", "-jar", "--source",
          "--upgrade-module-path", "--patch-module", "-d", "--describe-module", "--add-modules",
          "--enable-native-access", "--add-reads", "--add-exports", "--add-opens", "--limit-modules"]
single_dash_long = true
stop_at_operand = true
attached = ["-javaagent:", "-agentpath:", "-agentlib:", "-Xbootclasspath/a:", "-Xbootclasspath/p:", "-Xbootclasspath:",
            "-Xlog:", "-Xloggc:", "-XX:", "-splash:",
            "-Djava.security.manager=", "-Djava.system.class.loader=", "-Djava.library.path=",
            "-Djdk.module.path=", "-Djava.class.path=", "-Djava.ext.dirs=", "-Djava.endorsed.dirs="]
response_files = true
# (its main class, or a .java source run; then the program's arguments)
operands = ["java_main", "plain*"]
# (OpenJDK 21's -help and -X: every option)
strict = true
switches = ["--list-modules", "--dry-run", "--validate-modules", "-version", "--version", "-showversion",
            "--show-version", "--show-module-resolution", "-?", "-h", "-help", "--help", "-X", "--help-extra",
            "-esa", "-enablesystemassertions", "-dsa", "-disablesystemassertions", "-disable-@files",
            "--enable-preview", "-Xbatch", "-Xcomp", "-Xdebug", "-Xdiag", "-Xfuture", "-Xint", "-Xinternalversion",
            "-Xmixed", "-Xnoclassgc", "-Xrs", "-zero", "-dcevm", "-server", "-client", "-d64"]
# (-D's properties (the ones that load code: roles above), heap and stack
# sizes, assertions, settings shown, checks)
families = ["-D", "-Xms", "-Xmx", "-Xmn", "-Xss", "-Xverify", "-Xshare", "-XshowSettings", "-Xcheck:", "-verbose",
            "-ea", "-enableassertions", "-da", "-disableassertions"]
[spec.roles]
"-Xbootclasspath:" = "classpath"
"-Xloggc:" = "write"
"-splash:" = "read"
"--upgrade-module-path" = "classpath"
"--patch-module" = "module_patch"
"-Xlog:" = "java_log"
"-XX:" = "java_xx"
"-Djava.library.path=" = "classpath"
"-Djdk.module.path=" = "classpath"
"-Djava.class.path=" = "classpath"
"-Djava.ext.dirs=" = "classpath"
"-Djava.endorsed.dirs=" = "classpath"
"-Djava.security.manager=" = "configured"
"-Djava.system.class.loader=" = "configured"
"-javaagent:" = "agent_file"
"-agentpath:" = "agent_file"
"-agentlib:" = "agent_file"
"-Xbootclasspath/a:" = "classpath"
"-Xbootclasspath/p:" = "classpath"
"-jar" = "code_file"
"-cp" = "classpath"
"-classpath" = "classpath"
"--class-path" = "classpath"
"-p" = "classpath"
"--module-path" = "classpath"

[[spec]]
name = ["javac"]
values = ["-d", "-s", "-h", "-cp", "-classpath", "--class-path", "-sourcepath", "--source-path", "-processorpath",
          "--processor-path", "-processor", "-p", "--module-path", "-encoding", "--release", "-source", "-target",
          "-implicit", "-Xplugin", "--add-modules", "--boot-class-path", "-bootclasspath", "-endorseddirs",
          "-extdirs", "--limit-modules", "--module", "-m", "--module-source-path", "--module-version",
          "--processor-module-path", "-profile", "--system", "--upgrade-module-path", "--add-exports", "--add-reads",
          "--default-module-for-created-files", "--doclint-format", "--patch-module", "-Xmaxerrs", "-Xmaxwarns",
          "-Xstdout"]
single_dash_long = true
attached = ["-Xplugin:", "-J", "-Xbootclasspath:", "-Xbootclasspath/a:", "-Xbootclasspath/p:",
            "-Djava.endorsed.dirs=", "-Djava.ext.dirs="]
response_files = true
operands = "read"
# (OpenJDK 21's -help and -X: every option)
strict = true
switches = ["-deprecation", "--enable-preview", "-g", "--help", "-help", "-?", "--help-extra", "-X", "-nowarn",
            "-parameters", "-verbose", "--version", "-version", "-Werror", "-Xprint", "-XprintProcessorInfo",
            "-XprintRounds"]
families = ["-A", "-g:", "-implicit:", "-proc:", "-Xdiags:", "-Xdoclint", "-Xlint", "-Xpkginfo:", "-Xprefer:"]
[spec.roles]
# (-J-agentpath:...: the options of the JVM javac runs in)
"-J" = "options:java"
"-Xstdout" = "write"
"--system" = "program_dir"
"--boot-class-path" = "classpath"
"-bootclasspath" = "classpath"
"-endorseddirs" = "classpath"
"-extdirs" = "classpath"
"--processor-module-path" = "classpath"
"--upgrade-module-path" = "classpath"
"--patch-module" = "module_patch"
"-Xbootclasspath:" = "classpath"
"-Xbootclasspath/a:" = "classpath"
"-Xbootclasspath/p:" = "classpath"
"-Djava.endorsed.dirs=" = "classpath"
"-Djava.ext.dirs=" = "classpath"
"-d" = "write"
"-s" = "write"
"-h" = "write"
# (annotation processors and plugins found on these paths run in javac)
"-cp" = "classpath"
"-classpath" = "classpath"
"--class-path" = "classpath"
"-processorpath" = "classpath"
"--processor-path" = "classpath"
"-p" = "classpath"
"--module-path" = "classpath"

[[spec]]
name = ["ninja"]
values = ["-f", "-C", "-j", "-l", "-k", "-d", "-t", "-w"]
[spec.roles]
# (the manifest: its rules are the commands it runs)
"-f" = "code_file"
"-C" = "cwd"
[spec.flags]
"ninja" = {reason = "runs the build.ninja's commands", kind = "project_code"}

[[spec]]
name = ["gradle", "gradlew"]
values = ["-I", "--init-script", "-b", "--build-file", "-c", "--settings-file", "-p", "--project-dir", "-D",
          "--system-prop", "-P", "--project-prop", "-g", "--gradle-user-home", "--include-build", "-x",
          "--exclude-task", "--console", "--warning-mode", "--max-workers"]
attached = ["-D", "-P"]
[spec.roles]
# (scripts gradle runs: init scripts first, the build's and settings')
"-I" = "code_file"
"--init-script" = "code_file"
"-b" = "code_file"
"--build-file" = "code_file"
"-c" = "code_file"
"--settings-file" = "code_file"
"-p" = "project"
"--project-dir" = "project"
"--include-build" = "code_file"
"-g" = "configured"
"--gradle-user-home" = "configured"
# (-Dorg.gradle.jvmargs=...: its daemon's JVM options)
"-D" = "gradle_property"
"--system-prop" = "gradle_property"
[spec.flags]
"gradle" = {reason = "runs the build scripts", kind = "project_code"}
"gradlew" = {reason = "runs the build scripts", kind = "project_code"}

[[spec]]
name = ["mvn", "mvnw"]
values = ["-f", "--file", "-s", "--settings", "-gs", "--global-settings", "-t", "--toolchains", "-D", "-P",
          "-pl", "--projects", "-rf", "-T", "--threads", "-l", "--log-file"]
single_dash_long = true
attached = ["-D"]
[spec.roles]
# (the pom built: its plugins run)
"-f" = "project_file"
"--file" = "project_file"
"-s" = "configured"
"--settings" = "configured"
"-gs" = "configured"
"--global-settings" = "configured"
"-l" = "write"
"--log-file" = "write"
[spec.flags]
"mvn" = {reason = "runs the pom's plugins", kind = "project_code"}
"mvnw" = {reason = "runs the pom's plugins", kind = "project_code"}

# pytest [PATH...]: the tests under each path, their conftest.py files and
# the plugins they name
[[spec]]
name = ["pytest", "py.test"]
values = ["-c", "--config-file", "--rootdir", "--confcutdir", "-p", "-k", "-m", "--basetemp", "--junitxml",
          "--junit-xml", "--import-mode", "-o", "--override-ini", "--deselect", "--ignore", "--ignore-glob", "--tb",
          "--maxfail", "--durations", "-n", "--dist", "--cov", "--cov-report", "--log-file", "--result-log"]
operands = "project"
[spec.roles]
"-c" = "config_file"
"--config-file" = "config_file"
"--rootdir" = "project"
"--basetemp" = "write"
"--junitxml" = "write"
"--junit-xml" = "write"
"--log-file" = "write"
[spec.flags]
"pytest" = {reason = "runs the tests, their conftest.py files", kind = "project_code"}
"py.test" = {reason = "runs the tests, their conftest.py files", kind = "project_code"}

[[spec]]
name = ["zig"]
subcommands = true
commands = ["build", "build-exe", "build-lib", "build-obj", "test", "run", "fmt", "init", "fetch", "cc", "c++", "ar",
            "translate-c", "env", "help", "version", "zen", "objcopy", "ast-check", "std", "libc", "targets",
            "dlltool", "lib", "ranlib", "rc"]
[spec.sub.run]
# (its source files: built and run; after --, the program's arguments)
values = ["-femit-bin", "-target", "-O", "-M", "--dep", "-I", "-L", "-l", "--cache-dir", "--global-cache-dir",
          "--zig-lib-dir", "-mcpu"]
attached = ["-femit-bin="]
operands = "code_file"
[spec.sub.run.roles]
"--zig-lib-dir" = "code_file"
"-femit-bin=" = "write"
[spec.sub.test]
values = ["-femit-bin", "-target", "-O", "-M", "--dep", "-I", "-L", "-l", "--test-filter", "--test-cmd",
          "--zig-lib-dir", "--cache-dir", "--global-cache-dir"]
operands = "code_file"
[spec.sub.test.roles]
"--test-cmd" = "program"
"--zig-lib-dir" = "code_file"
[spec.sub.build]
values = ["--build-file", "--build-runner", "--prefix", "-p", "--cache-dir", "--global-cache-dir", "--zig-lib-dir",
          "--search-prefix", "-j"]
[spec.sub.build.roles]
"--build-file" = "code_file"
"--build-runner" = "code_file"
"--zig-lib-dir" = "code_file"
"--prefix" = "write"
"-p" = "write"
[spec.sub.build.flags]
"build" = {reason = "runs the build.zig program", kind = "project_code"}
[spec.sub.build-exe]
values = ["-femit-bin", "-target", "-O", "-M", "--dep", "-I", "-L", "-l", "--zig-lib-dir"]
operands = "read"
[spec.sub.build-exe.roles]
"--zig-lib-dir" = "code_file"
