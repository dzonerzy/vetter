# PowerShell cmdlets: their aliases, their parameters' roles (a parameter is
# matched by any prefix that names only it: -Rec is -Recurse), and which are
# positional (bound by position when not named). Roles as in README.md, and:
# `pwsh` PowerShell code (a string read again), `program` a program run,
# `program_args` its arguments, `flag` a switch, `elevates` a verb that runs
# the program elevated when it's RunAs.

