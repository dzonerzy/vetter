name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    workflow_call:

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/ruff-action@v3

    test:
        name: Test (Python ${{ matrix.python }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python: ["3.11", "3.12", "3.14"]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}

            - name: Install
              run: python -m pip install '.[test]'

            - name: The stock policy's tests
              run: vetter test

            # (one process: zrun compiles vetter's code as each path is first
            # reached, and parallel workers each compiled and optimized it
            # at once, about 25 GB; one process takes about 6)
            - name: Test (both of zrun's modes, against the recorded answers)
              run: python -m pytest -q -n 0

            - name: The corpus
              run: python -m tools.corpus.decide_corpus

    build:
        name: Build
        needs: [lint, test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Build the wheel and the sdist
              run: python -m pip install build && python -m build

            - name: Check the specs and the built-in policies are in the wheel
              run: |
                  python -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); \
                  need = ['vetter/policy/builtin/stock.vet', 'vetter/policy/builtin/prelude.vet', 'vetter/specs/git.toml', \
                  'vetter/shells/bash/bash.zgram', 'vetter/shells/python/python.zgram']; \
                  missing = [n for n in need if n not in names]; assert not missing, missing"

            - uses: actions/upload-artifact@v4
              with:
                  name: wheel-vetter
                  path: dist/*
